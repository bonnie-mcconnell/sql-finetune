[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I",   # pyflakes/pycodestyle errors, unused imports, import sorting
    "BLE",           # blind-except detection
    "RUF",           # ruff-specific checks (e.g. unused unpacked variables)
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
